<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Maurya Carpet - Admin Login</title>

<link rel="stylesheet" href="admin.css">

</head><body><div class="login-container">

    <div class="login-box">

        <div class="logo">
            <h1>MAURYA</h1>
            <span>CARPET</span>
        </div>

        <h2>Admin Login</h2>
        <p>Welcome to Maurya Carpet Admin Panel</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit">LOGIN</button>

            <div id="errorMessage"></div>

        </form>

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
