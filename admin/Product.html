<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Maurya Carpet - Products</title>

    <link rel="stylesheet" href="admin.css">

    <style>

        /* =========================
           PRODUCT PAGE
        ========================== */

        .product-content {
            padding: 25px;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .product-header h1 {
            margin: 0;
        }

        .product-header p {
            margin-top: 6px;
            color: #777;
        }

        .add-product-btn {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            background: #8b0000;
            color: white;
        }


        /* PRODUCT GRID */

        .product-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(240px, 1fr));

            gap: 22px;
        }


        /* PRODUCT CARD */

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.10);
        }

        .product-photo {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .no-photo {
            width: 100%;
            height: 190px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eee;
            color: #777;
        }

        .product-info {
            padding: 16px;
        }

        .product-info h3 {
            margin: 0 0 8px;
        }

        .product-category {
            color: #777;
            font-size: 13px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        .product-size {
            margin-top: 6px;
            color: #555;
        }

        .product-description {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-product,
        .delete-product {
            flex: 1;
            border: none;
            padding: 9px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-product {
            background: #0d6efd;
            color: white;
        }

        .delete-product {
            background: #dc3545;
            color: white;
        }


        /* EMPTY */

        .empty-products {
            background: white;
            padding: 50px 20px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }


        /* =========================
           PRODUCT FORM
        ========================== */

        .product-form-page {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.08);
        }

        .product-form-page.show {
            display: block;
        }

        .back-button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .product-form {
            max-width: 700px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {

            width: 100%;
            box-sizing: border-box;

            padding: 11px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 14px;
        }

        .form-group textarea {
            height: 110px;
            resize: vertical;
        }


        /* PHOTO */

        .photo-area {
            border: 2px dashed #bbb;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .photo-area input {
            border: none;
            padding: 10px;
        }

        #photoPreview {

            display: none;

            width: 220px;
            height: 160px;

            object-fit: cover;

            border-radius: 8px;

            margin: 15px auto 0;
        }


        /* FORM BUTTON */

        .save-product {

            border: none;

            background: #198754;
            color: white;

            padding: 12px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
        }

        .cancel-product {

            border: none;

            background: #777;
            color: white;

            padding: 12px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;

            margin-left: 8px;
        }


        @media(max-width: 600px) {

            .product-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .add-product-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="dashboard">


    <!-- =========================
         SAME SIDEBAR AS DASHBOARD
    ========================== -->

    <aside class="sidebar">


        <div class="brand">

            <h2>MAURYA</h2>

            <span>CARPET</span>

        </div>


        <nav>


            <a href="Dashboard.html">

                📊 Dashboard

            </a>


            <a href="Product.html"
               class="active">

                🧶 Products

            </a>


            <a href="Order.html">

                📦 Orders

            </a>


            <a href="Customer.html">

                👥 Customers

            </a>


            <a href="Enquiry.html">

                📩 Enquiries

            </a>


        </nav>


        <button
            class="logout-btn"
            onclick="logout()">

            🚪 Logout

        </button>


    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">


        <!-- PRODUCT LIST -->

        <div
            class="product-content"
            id="productListPage">


            <header class="topbar">

                <div>

                    <h1>Products</h1>

                    <p>
                        Manage your carpet products
                    </p>

                </div>


                <div class="admin-name">

                    👤 Admin

                </div>

            </header>


            <div class="product-header">

                <div>

                    <h2>
                        Carpet Collection
                    </h2>

                    <p>
                        Add, edit and delete your products
                    </p>

                </div>


                <button
                    class="add-product-btn"
                    onclick="openAddProduct()">

                    + Add Product

                </button>

            </div>


            <div
                class="product-grid"
                id="productGrid">

            </div>


        </div>



        <!-- =========================
             ADD / EDIT FORM
        ========================== -->

        <div
            class="product-content"
            id="productFormPage"
            style="display:none;">


            <div class="product-form-page"
                 style="display:block;">


                <button
                    class="back-button"
                    onclick="closeProductForm()">

                    ← Back to Products

                </button>


                <h2 id="formTitle">
                    Add Product
                </h2>


                <form
                    class="product-form"
                    id="productForm">


                    <input
                        type="hidden"
                        id="productId">


                    <!-- NAME -->

                    <div class="form-group">

                        <label>
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="productName"
                            placeholder="Enter carpet name"
                            required>

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <select
                            id="productCategory"
                            required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Persian">
                                Persian
                            </option>

                            <option value="Modern">
                                Modern
                            </option>

                            <option value="Traditional">
                                Traditional
                            </option>

                            <option value="Handmade">
                                Handmade
                            </option>

                            <option value="Woolen">
                                Woolen
                            </option>

                            <option value="Custom">
                                Custom
                            </option>

                        </select>

                    </div>


                    <!-- PRICE -->

                    <div class="form-group">

                        <label>
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="Enter price"
                            min="0"
                            required>

                    </div>


                    <!-- SIZE -->

                    <div class="form-group">

                        <label>
                            Size
                        </label>

                        <input
                            type="text"
                            id="productSize"
                            placeholder="Example: 6x9 ft"
                            required>

                    </div>


                    <!-- PHOTO -->

                    <div class="form-group">

                        <label>
                            Product Photo
                        </label>


                        <div class="photo-area">


                            <p>
                                📷 Select photo from Gallery
                                or Camera
                            </p>


                            <input
                                type="file"
                                id="productPhoto"
                                accept="image/*"
                                capture="environment">


                            <img
                                id="photoPreview"
                                alt="Product Photo">

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="productDescription"
                            placeholder="Enter carpet description">
                        </textarea>

                    </div>


                    <button
                        type="submit"
                        class="save-product">

                        Save Product

                    </button>


                    <button
                        type="button"
                        class="cancel-product"
                        onclick="closeProductForm()">

                        Cancel

                    </button>


                </form>


            </div>

        </div>


    </main>


</div>



<script src="admin.js"></script>


<script>


/* =========================
   PRODUCT STORAGE
========================== */


async function getProductsData() {
    const response = await fetch("/api/products");
    if (!response.ok) throw new Error("Unable to load products");
    return response.json();
}

async function saveProductsData(products) {
    // Product changes are sent through the API. This helper is kept for compatibility.
    return products;
}


/* =========================
   LOAD PRODUCTS
========================== */


async function loadProductCards() {


    const products =
        await getProductsData();


    const grid =
        document.getElementById(
            "productGrid"
        );


    grid.innerHTML = "";


    if (products.length === 0) {


        grid.innerHTML = `

            <div class="empty-products">

                <h3>
                    No Products Added
                </h3>

                <p>
                    Click "+ Add Product"
                    to add your first carpet.
                </p>

            </div>

        `;


        return;

    }


    products
        .slice()
        .reverse()
        .forEach(function(product) {


            const card =
                document.createElement("div");


            card.className =
                "product-card";


            let photo;


            if (product.image) {

                photo = `

                    <img
                        src="${product.image}"
                        class="product-photo"
                        alt="Carpet">

                `;

            } else {

                photo = `

                    <div class="no-photo">

                        No Photo

                    </div>

                `;

            }


            card.innerHTML = `

                ${photo}

                <div class="product-info">

                    <h3>
                        ${product.name || "-"}
                    </h3>

                    <div class="product-category">
                        ${product.category || "-"}
                    </div>

                    <div class="product-price">
                        ₹${product.price || "0"}
                    </div>

                    <div class="product-size">
                        Size: ${product.size || "-"}
                    </div>

                    <div class="product-description">
                        ${product.description || ""}
                    </div>

                    <div class="product-actions">

                        <button
                            class="edit-product"
                            onclick="editProduct(${product.id})">

                            ✏️ Edit

                        </button>

                        <button
                            class="delete-product"
                            onclick="deleteProductItem(${product.id})">

                            🗑️ Delete

                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(card);


        });

}


/* =========================
   OPEN ADD FORM
========================== */


function openAddProduct() {


    document
        .getElementById("productListPage")
        .style.display = "none";


    document
        .getElementById("productFormPage")
        .style.display = "block";


    document
        .getElementById("formTitle")
        .textContent = "Add Product";


    document
        .getElementById("productForm")
        .reset();


    document
        .getElementById("productId")
        .value = "";


    currentPhoto = "";


    document
        .getElementById("photoPreview")
        .style.display = "none";

}


/* =========================
   CLOSE FORM
========================== */


function closeProductForm() {


    document
        .getElementById("productFormPage")
        .style.display = "none";


    document
        .getElementById("productListPage")
        .style.display = "block";


    loadProductCards();

}


/* =========================
   PHOTO
========================== */


let currentPhoto = "";


document
    .getElementById("productPhoto")
    .addEventListener(
        "change",
        function(event) {


            const file =
                event.target.files[0];


            if (!file) return;


            const reader =
                new FileReader();


            reader.onload =
                function(e) {


                    currentPhoto =
                        e.target.result;


                    const preview =
                        document.getElementById(
                            "photoPreview"
                        );


                    preview.src =
                        currentPhoto;


                    preview.style.display =
                        "block";

                };


            reader.readAsDataURL(file);

        }
    );


/* =========================
   SAVE PRODUCT
========================== */


document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            let products =
                await getProductsData();


            const id =
                document.getElementById(
                    "productId"
                ).value;


            const productData = {


                name:
                    document.getElementById(
                        "productName"
                    ).value.trim(),


                category:
                    document.getElementById(
                        "productCategory"
                    ).value,


                price:
                    document.getElementById(
                        "productPrice"
                    ).value,


                size:
                    document.getElementById(
                        "productSize"
                    ).value.trim(),


                description:
                    document.getElementById(
                        "productDescription"
                    ).value.trim()

            };


            try {
                const payload = { ...productData, image: currentPhoto || undefined };
                if (id) {
                    await fetch(`/api/products/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    }).then(async r => { if (!r.ok) throw new Error((await r.json()).message || "Update failed"); });
                    alert("Product Updated Successfully!");
                } else {
                   await fetch("/api/products", {
                       method: "POST",
                       headers: { "Content-Type": "application/json" },
                         body: JSON.stringify({ ...productData, image: currentPhoto })
                               }).then(async r => {
                              if (!r.ok) throw new Error((await r.json()).message || "Add failed");    
                            });
                    alert("Product Added Successfully!");
                }
                closeProductForm();
            } catch (error) {
                alert("Product save failed: " + error.message);
            }


        }
    );


/* =========================
   EDIT
========================== */


async function editProduct(id) {


    const products =
        await getProductsData();


    const product =
        products.find(
            function(item) {

                return Number(item.id)
                    === Number(id);

            }
        );


    if (!product) return;


    document
        .getElementById("productListPage")
        .style.display = "none";


    document
        .getElementById("productFormPage")
        .style.display = "block";


    document
        .getElementById("formTitle")
        .textContent = "Edit Product";


    document
        .getElementById("productId")
        .value = product.id;


    document
        .getElementById("productName")
        .value = product.name || "";


    document
        .getElementById("productCategory")
        .value = product.category || "";


    document
        .getElementById("productPrice")
        .value = product.price || "";


    document
        .getElementById("productSize")
        .value = product.size || "";


    document
        .getElementById("productDescription")
        .value =
            product.description || "";


    currentPhoto = "";


    const preview =
        document.getElementById(
            "photoPreview"
        );


    if (product.image) {

        preview.src =
            product.image;

        preview.style.display =
            "block";

    } else {

        preview.style.display =
            "none";

    }

}


/* =========================
   DELETE
========================== */


async function deleteProductItem(id) {


    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {
        const response = await fetch(`/api/products/${id}`, { method: "DELETE" });
        if (!response.ok) throw new Error("Delete failed");
        loadProductCards();
    } catch (error) {
        alert("Product delete failed: " + error.message);
    }


}


/* =========================
   FIRST LOAD
========================== */


document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProductCards();

    }
);

</script>


</body>

</html>
